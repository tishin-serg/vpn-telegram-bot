message:
  start: "Привет.\nVPNbot - это сервис для быстрого доступа к любимым соц. сетям и сервисам и безопасной передачи данных.\nНастройка в 2 клика.\n\n💲 Стоимость от 98 ₽ в месяц.\n🔝 Нет лимита трафика.\n🚀 Скорость от 100 Мбит/с.\nСервер в Польше🇵🇱\n\nПопробуйте VPN бесплатно на 7 дней или купите полный доступ, выберите в меню ниже."
  help: "Что такое VPN и зачем оно мне?\nVPN это виртуальная частная сеть, которая, используя цифровой туннель, 'переносит' вас в ту страну, где находится сервер VPN. В нашем случае в Польше 🇵🇱. Нужно это бывает в случаях, когда внутри вашей страны некоторые сайты не работают.\n\nПолучил ссылку. Дальше что?\nСсылка это и есть ваш персональный ключ, который подключает вас к нашему серверу VPN. Если вы сделали всё по инструкции, то включение и выключение VPN будет происходить через приложение Outline нажатием одной кнопки подключить/отключить."
  trial-not-used: "Ты можешь протестировать VPN бесплатно в течение 7 дней, прежде чем решиться на покупку. Нажми на кнопку ниже, чтобы получить VPN-ключ и начать бесплатный период."
  trial-used: "Пробный период уже использован. Если он истек, приобрети полный доступ, выбрав количество месяцев кнопкой ниже."
  stop: "Чтобы продолжить использовать бота нажми на команду /start"
  unknown: "Незнакомая команда. Используй /commands для отображения существующих"
  full-access: "Выбери тариф для подключения"
